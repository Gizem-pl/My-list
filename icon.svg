<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd476"/>
      <stop offset="1" stop-color="#22a447"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M414 268 Q418 292 442 296 Q418 300 414 324 Q410 300 386 296 Q410 292 414 268Z"/>
    <path d="M104 150 Q107 164 121 167 Q107 170 104 184 Q101 170 87 167 Q101 164 104 150Z" opacity="0.85"/>
    <circle cx="98" cy="300" r="7" opacity="0.7"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="256" cy="452" rx="124" ry="14" fill="#000" opacity="0.13"/>

  <!-- baguette -->
  <g transform="translate(200 262) rotate(-22)">
    <rect x="-28" y="-178" width="56" height="210" rx="28" fill="#f4b95c"/>
    <g stroke="#cf862f" stroke-width="9" stroke-linecap="round">
      <line x1="-12" y1="-140" x2="12" y2="-122"/>
      <line x1="-12" y1="-102" x2="12" y2="-84"/>
      <line x1="-12" y1="-64" x2="12" y2="-46"/>
    </g>
  </g>

  <!-- carrot -->
  <g transform="translate(318 262) rotate(20)">
    <g fill="#b8ee6a">
      <ellipse cx="-14" cy="-182" rx="11" ry="30" transform="rotate(-22 -14 -182)"/>
      <ellipse cx="0" cy="-192" rx="11" ry="34"/>
      <ellipse cx="14" cy="-182" rx="11" ry="30" transform="rotate(22 14 -182)"/>
    </g>
    <path d="M-32 -158 Q0 -172 32 -158 L9 22 Q0 34 -9 22Z" fill="#ff922b"/>
    <g stroke="#e0701a" stroke-width="7" stroke-linecap="round">
      <line x1="-22" y1="-118" x2="-6" y2="-116"/>
      <line x1="6" y1="-84" x2="20" y2="-86"/>
    </g>
  </g>

  <!-- apple -->
  <path d="M262 186 Q258 168 266 156" stroke="#7a4a22" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="286" cy="166" rx="20" ry="10" fill="#8fdc4e" transform="rotate(-25 286 166)"/>
  <circle cx="260" cy="238" r="54" fill="#ff5a4e"/>
  <ellipse cx="240" cy="214" rx="12" ry="18" fill="#fff" opacity="0.35" transform="rotate(30 240 214)"/>

  <!-- bag -->
  <path d="M150 256 L362 256 L348 430 Q346 446 330 446 L182 446 Q166 446 164 430Z" fill="#f7dfb2"/>
  <rect x="142" y="238" width="228" height="38" rx="12" fill="#eac68b"/>

  <!-- happy face -->
  <g fill="#8a5a2b">
    <circle cx="228" cy="340" r="10"/>
    <circle cx="284" cy="340" r="10"/>
  </g>
  <path d="M234 370 Q256 392 278 370" stroke="#8a5a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g fill="#ff8f7a" opacity="0.55">
    <ellipse cx="204" cy="366" rx="14" ry="9"/>
    <ellipse cx="308" cy="366" rx="14" ry="9"/>
  </g>
