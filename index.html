<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grocery List</title>

  <!-- Full-screen Home Screen app on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grocery List">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Grocery List</h1>
    </header>

    <nav id="tabs" class="tabs" aria-label="Filter by store"></nav>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="name" type="text" placeholder="Item, e.g. Milk" aria-label="Item name" maxlength="100" enterkeyhint="done">
      <div class="row">
        <input id="qty" type="text" placeholder="Qty (2x, 500g)" aria-label="Quantity (optional)" maxlength="20" enterkeyhint="done">
        <select id="category" aria-label="Category"></select>
      </div>
      <div class="row">
        <select id="store" aria-label="Store"></select>
        <button type="submit" class="add-btn">Add</button>
      </div>
    </form>

    <section id="active"></section>
    <p id="empty" class="empty">Nothing to buy here. Add an item above.</p>

    <section id="cart-section" class="cart-section">
      <div class="cart-header">
        <h2>In Cart <span id="cart-count" class="count"></span></h2>
        <button id="clear-cart" type="button" class="clear-btn">Clear Cart</button>
      </div>
      <p class="hint">Tap an item to put it back on the list.</p>
      <ul id="cart" class="list"></ul>
    </section>

    <details id="custom" class="custom">
      <summary>My categories</summary>
      <p class="hint">Make your own, like “Travel” for passport, charger, iPad. Pick “+ New category…” in the category menu, or add one here.</p>
      <form id="cat-form" class="cat-form" autocomplete="off">
        <input id="cat-name" type="text" placeholder="New category name" aria-label="New category name" maxlength="30">
        <button type="submit">Add</button>
      </form>
      <ul id="cat-list" class="cat-list"></ul>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
