<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My list</title>
  <meta name="description" content="A simple grocery list that works offline.">

  <!-- Full-screen Home Screen app on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My list">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" href="icon-sky-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="title-row">
      <h1>My list</h1>
      <button id="menu-btn" class="round-btn" type="button" aria-label="More options">•••</button>
    </header>

    <div class="sticky">
      <nav id="lists" class="chips" aria-label="Your lists"></nav>
      <nav id="stores" class="chips" aria-label="Filter by store"></nav>
    </div>

    <div id="inbox" class="banner" hidden></div>

    <main id="content"></main>

    <section id="cart" class="cart" hidden>
      <div class="cart-head">
        <h2>In Cart <span id="cart-count" class="count"></span></h2>
        <button id="clear-cart" type="button" class="pill-btn danger">Clear Cart</button>
      </div>
      <p class="hint">Tap an item to put it back on the list.</p>
      <div id="cart-grid" class="rows"></div>
    </section>

    <p id="tip" class="hint tip" hidden>Tip: press and hold an item to change its amount, category or store.</p>
  </div>

  <div class="add-bar">
    <button id="add-btn" type="button" class="add-pill"><span class="plus">＋</span> Add item</button>
  </div>

  <div id="backdrop" class="backdrop"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
